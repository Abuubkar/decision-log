 {id:11,date:'2026-02-09',area:'Product',owner:'Priya',status:'active',

 {id:10,date:'2025-10-16',area:'Product',owner:'Ellie',status:'active',

 {id:9,date:'2025-07-08',area:'GTM',owner:'Marcus',status:'active',

 {id:7,date:'2025-02-13',area:'Engineering',owner:'Naz',status:'active',

});

        <label>Why</label><textarea name="why" required placeholder="The reasoning, in your words. This is the part that decays."></textarea>
        <div class="row2">
          <div><label>Decided on</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}" max="${new Date().toISOString().slice(0,10)}" /></div>
          <div><label>Owner</label><input name="owner" required placeholder="First name" /></div>
        </div>
        <label>Area</label><select name="area" required>${AREAS.map(a=>`<option>${a}</option>`).join('')}</select>
      </div>
      <div class="ft"><button type="button" class="ghost" data-close>Cancel</button><button class="btn" type="submit">Add decision</button></div>
      </form>`;
  }
}

/* G, revised: read-only rows, click opens drawer */
V.G = function(){
  const list = visible(), c = counts();
  const sb = (v,l) => `<button data-status="${v}" aria-pressed="${S.status===v}"><span>${l}</span><span>${c[v]}</span></button>`;
  const row = d => { const f=fmt(d.date); return `
    <div class="li ${past(d)?'is-past':''}" data-open="${d.id}" role="button" tabindex="0">
      <div>
        <h3><span class="dot ${d.status}"></span>${esc(d.title)}</h3>
        <p class="dec">${esc(d.dec)}</p>
        <p class="why">${esc(d.why)}</p>
      </div>
      <div class="side"><b>${f.d} ${f.y}</b>${d.owner}<br>${d.area}<span class="stw ${d.status}">${d.status}</span></div>
    </div>`; };
  return `<div class="v-g">
    ${appbar()}
    <header class="hero"><div class="wrap"><h1>${HERO.h}</h1><p>${HERO.p}</p></div></header>
    <div class="frame" id="log"><div class="box">
      <div class="gtop">
        <input data-q value="${esc(S.q)}" placeholder="Search decisions" />
        <span class="sp"></span>
        <button class="setbtn" data-reset>Reset</button>
        <button class="new" data-new>New decision</button>
      </div>
      <div class="gbody">
        <aside class="gside">
          <div class="grp"><h4>Status</h4>${sb('all','All')}${sb('active','Active')}${sb('superseded','Superseded')}${sb('reversed','Reversed')}</div>
          <div class="grp"><h4>Area</h4>
            <button data-area="all" aria-pressed="${S.area==='all'}"><span>Every area</span></button>
            ${AREAS.map(a=>`<button data-area="${a}" aria-pressed="${S.area===a}"><span>${a}</span><span>${S.items.filter(d=>d.area===a).length}</span></button>`).join('')}
          </div>
        </aside>
        <main>${byYear(list, row) || `<p class="empty" style="padding:40px 20px">Nothing matches that.</p>`}</main>
      </div>
    </div></div>
  </div>`;
};

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-close]') || t.id === 'dr-bg') return closeDrawer();
  if (t.closest('[data-new]')) return openDrawer({type:'create'});
  const st = t.closest('[data-st]');
  if (st && S.drawer && S.drawer.type==='view'){
    const d = S.items.find(x=>x.id===S.drawer.id); const prev = d.status, next = st.dataset.st;
    if (prev === next) return;
    d.status = next; render(); renderDrawer();
    return toast(`Marked “${d.title}” ${next}`, () => { d.status = prev; render(); renderDrawer(); toast('Put back'); });
  }
  if (t.closest('[data-undo]')){ const el=document.getElementById('toast'); const u=el._undo; el.classList.remove('on'); if(u) u(); return; }
  const open = t.closest('[data-open]');
  if (open && S.variant==='G') return openDrawer({type:'view', id:+open.dataset.open});
  if (t.closest('[data-reset]') && S.variant==='G'){ closeDrawer(); toast('Demo reset to the seed data'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.drawer) closeDrawer();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.open) e.target.click();
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'newf') return;
  e.preventDefault();
  const f = new FormData(e.target);
  const d = {id: Math.max(...S.items.map(x=>x.id))+1, status:'active',
    title:f.get('title').trim(), dec:f.get('dec').trim(), why:f.get('why').trim(),
    date:f.get('date'), owner:f.get('owner').trim(), area:f.get('area')};
  S.items.push(d); S.items.sort((a,b)=>b.date.localeCompare(a.date));
  closeDrawer(); render();
  toast(`Added “${d.title}”`);
});
if (S.variant === 'G') render();
</script>
<script>
const filtersOn = () => S.status !== 'all' || S.area !== 'all' || S.q.trim() !== '';
function clearFilters(){ S.status='all'; S.area='all'; S.q=''; render(); }
const today = () => new Date().toISOString().slice(0,10);

function formHtml(d){
  const v = k => d ? esc(d[k]) : '';
  return `
    <form id="decf" data-mode="${d?'edit':'create'}">
    <div class="bd">
      <label>Title</label><input name="title" required autofocus value="${v('title')}" placeholder="One line, the way you'd say it out loud" />
      <label>What we decided</label><textarea name="dec" required placeholder="The call itself">${v('dec')}</textarea>
      <label>Why</label><textarea name="why" required placeholder="The reasoning, in your words. This is the part that decays.">${v('why')}</textarea>
      <div class="row2">
        <div><label>Decided on</label><input name="date" type="date" required value="${d?d.date:today()}" max="${today()}" /></div>
        <div><label>Owner</label><input name="owner" required value="${v('owner')}" placeholder="First name" /></div>
      </div>
      <label>Area</label><select name="area" required>${AREAS.map(a=>`<option ${d&&d.area===a?'selected':''}>${a}</option>`).join('')}</select>
    </div>
    <div class="ft">
      <button type="button" class="ghost" data-${d?'back':'close'}>Cancel</button>
      <button class="btn" type="submit">${d?'Save':'Add decision'}</button>
    </div>
    </form>`;
}

function renderDrawer(){
  const el = document.getElementById('dr'); if (!S.drawer) return;
  const t = S.drawer.type;
  if (t === 'view'){
    const d = S.items.find(x=>x.id===S.drawer.id); if (!d) return closeDrawer();
    const f = fmt(d.date);
    el.innerHTML = `
      <div class="hd"><span class="ttl">Decision</span>
        <span class="acts"><button class="edit" data-edit>Edit</button><button class="x" data-close aria-label="Close">&times;</button></span></div>
      <div class="bd">
        <h2>${esc(d.title)}</h2>
        <dl>
          <dt>Decided</dt><dd>${esc(d.dec)}</dd>
          <dt>Because</dt><dd class="why">${esc(d.why)}</dd>
          <dt>On</dt><dd>${f.d} ${f.y}</dd>
          <dt>Owner</dt><dd>${d.owner}</dd>
          <dt>Area</dt><dd>${d.area}</dd>
        </dl>
        <div class="sec">
          <h4>Standing</h4>
          <span class="seg">${['active','superseded','reversed'].map(s=>`<button data-st="${s}" aria-pressed="${d.status===s}">${cap(s)}</button>`).join('')}</span>
          <p class="hint">${d.status==='active' ? 'Mark it superseded if a later decision replaced it, or reversed if the team went back on it.' : 'Marking it active again puts it back in force.'}</p>
        </div>
      </div>`;
  } else if (t === 'edit'){
    const d = S.items.find(x=>x.id===S.drawer.id); if (!d) return closeDrawer();
    el.innerHTML = `<div class="hd"><span class="ttl">Edit decision</span><button class="x" data-close aria-label="Close">&times;</button></div>${formHtml(d)}`;
  } else {
    el.innerHTML = `<div class="hd"><span class="ttl">New decision</span><button class="x" data-close aria-label="Close">&times;</button></div>${formHtml(null)}`;
  }
  el.scrollTop = 0;
}

V.G = function(){
  const list = visible(), c = counts();
  const sb = (v,l) => `<button data-status="${v}" aria-pressed="${S.status===v}"><span>${l}</span><span>${c[v]}</span></button>`;
  const row = d => { const f=fmt(d.date); return `
    <div class="li ${past(d)?'is-past':''}" data-open="${d.id}" role="button" tabindex="0">
      <div>
        <h3><span class="dot ${d.status}"></span>${esc(d.title)}</h3>
        <p class="dec">${esc(d.dec)}</p>
        <p class="why">${esc(d.why)}</p>
      </div>
      <div class="side"><b>${f.d} ${f.y}</b>${d.owner}<br>${d.area}<span class="stw ${d.status}">${d.status}</span></div>
    </div>`; };
  return `<div class="v-g">
    <div class="appbar"><div class="wrap">
      <span class="mark">Decision Log</span>
      <span class="nav"><button class="ghost" data-reset>Reset demo</button><a class="cta" href="#log">Try the demo</a></span>
    </div></div>
    <header class="hero"><div class="wrap"><h1>${HERO.h}</h1><p>${HERO.p}</p></div></header>
    <div class="frame" id="log"><div class="box">
      <div class="gtop">
        <input data-q value="${esc(S.q)}" placeholder="Search decisions" />
        ${filtersOn() ? '<button class="clear" data-clear>Clear filters</button>' : ''}
        <span class="sp"></span>
        <button class="new" data-new>New decision</button>
      </div>
      <div class="gbody">
        <aside class="gside">
          <div class="grp"><h4>Status</h4>${sb('all','All')}${sb('active','Active')}${sb('superseded','Superseded')}${sb('reversed','Reversed')}</div>
          <div class="grp"><h4>Area</h4>
            <button data-area="all" aria-pressed="${S.area==='all'}"><span>Every area</span></button>
            ${AREAS.map(a=>`<button data-area="${a}" aria-pressed="${S.area===a}"><span>${a}</span><span>${S.items.filter(d=>d.area===a).length}</span></button>`).join('')}
          </div>
        </aside>
        <main>${byYear(list, row) || `<p class="empty" style="padding:40px 20px">Nothing matches that.</p>`}</main>
      </div>
    </div></div>
  </div>`;
};

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-clear]')) return clearFilters();
  if (t.closest('[data-edit]') && S.drawer) { S.drawer = {type:'edit', id:S.drawer.id}; return renderDrawer(); }
  if (t.closest('[data-back]') && S.drawer) { S.drawer = {type:'view', id:S.drawer.id}; return renderDrawer(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'decf') return;
  e.preventDefault();
  const f = new FormData(e.target);
  const vals = {title:f.get('title').trim(), dec:f.get('dec').trim(), why:f.get('why').trim(),
    date:f.get('date'), owner:f.get('owner').trim(), area:f.get('area')};
  if (e.target.dataset.mode === 'edit'){
    const d = S.items.find(x=>x.id===S.drawer.id); Object.assign(d, vals);
    S.items.sort((a,b)=>b.date.localeCompare(a.date));
    S.drawer = {type:'view', id:d.id}; render(); renderDrawer();
    return toast('Saved');
  }
  const d = {id: Math.max(...S.items.map(x=>x.id))+1, status:'active', ...vals};
  S.items.push(d); S.items.sort((a,b)=>b.date.localeCompare(a.date));
  closeDrawer(); render();
  toast(`Added “${d.title}”`);
});
if (S.variant === 'G') render();
</script>
