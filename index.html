<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="preload"
      href="/fonts/source-serif-4.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Decision Log — what your team decided, and why</title>
    <meta
      name="description"
      content="Record what your team decided, who decided it, and the reasoning behind it, so nobody has to rebuild the argument six months later."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abuubkar.github.io/decision-log/" />
    <meta property="og:title" content="Six months from now, someone will ask why." />
    <meta
      property="og:description"
      content="Record what your team decided, who decided it, and the reasoning behind it."
    />
    <!-- 1200x630 is the size the scrapers crop to, so it is the size we hand
         them. Declaring it lets a card reserve the space before the fetch. -->
    <meta property="og:image" content="https://abuubkar.github.io/decision-log/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Decision Log demo, showing decisions filtered by status and area."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/landing/main.tsx"></script>
  </body>
</html>
